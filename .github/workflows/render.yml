name: Générer les visuels
on:
  push:
    paths: ['posts/**/post.json', 'posts/**/sources.json', 'render/**', 'assets/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: render
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: node render/candidates.mjs
      - run: node render/render.mjs
      - name: Enregistrer les visuels
        run: |
          git config user.name "daily-driver-bot"
          git config user.email "bot@users.noreply.github.com"
          git add posts
          git diff --cached --quiet && exit 0
          git commit -m "Visuels générés"
          for i in 1 2 3 4 5; do git pull --rebase -X theirs && git push && exit 0; git rebase --abort 2>/dev/null; sleep 5; done
          exit 1
