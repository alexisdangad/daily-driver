name: Générer les visuels
on:
  push:
    paths: ['posts/**/post.json', 'render/**', 'assets/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: render
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: node render/render.mjs
      - name: Enregistrer les visuels
        run: |
          git config user.name "daily-driver-bot"
          git config user.email "bot@users.noreply.github.com"
          git add posts
          git diff --cached --quiet || (git commit -m "Visuels générés" && git pull --rebase && git push)
