name: Publier sur Instagram
on:
  schedule: [{ cron: '*/15 * * * *' }]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node render/publish.mjs
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
      - name: Enregistrer l'état
        run: |
          git config user.name "daily-driver-bot"
          git config user.email "bot@users.noreply.github.com"
          git add posts
          git diff --cached --quiet || (git commit -m "Publication Instagram" && git pull --rebase && git push)
