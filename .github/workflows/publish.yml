name: Publier sur Instagram
on:
  schedule: [{ cron: '*/15 * * * *' }]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Vérifier l'accès Instagram (manuel)
        if: github.event_name == 'workflow_dispatch'
        run: |
          curl -s "${IG_API_BASE:-https://graph.facebook.com/v21.0}/${IG_USER_ID}?fields=username,media_count&access_token=${IG_TOKEN}" | sed 's/access_token=[^"&]*/access_token=***/g'
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_API_BASE: ${{ vars.IG_API_BASE || '' }}
      - run: node render/publish.mjs
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_API_BASE: ${{ vars.IG_API_BASE || '' }}
      - run: node render/stats.mjs
        continue-on-error: true
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_API_BASE: ${{ vars.IG_API_BASE || '' }}
      - name: Enregistrer l'état
        run: |
          git config user.name "daily-driver-bot"
          git config user.email "bot@users.noreply.github.com"
          git add posts stats
          git diff --cached --quiet || (git commit -m "Publication Instagram" && git pull --rebase && git push)
